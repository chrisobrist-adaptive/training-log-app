    <!-- maximum-scale/user-scalable=no stop the occasional "opens slightly
         zoomed and off-centre" glitch some mobile browsers show on load —
         without a fixed scale, the browser can restore a stale zoom/pan
         state from a previous visit instead of always opening at 1:1.
         viewport-fit=cover is what lets env(safe-area-inset-bottom) (used by
         the athlete bottom tab bar) actually resolve to the real inset on
         notched/home-indicator phones instead of defaulting to 0. -->

         arrives, then switched to all). A normal blocking stylesheet link
         made iOS wait on a network round trip before painting anything —
         including the splash — and a screen recording showed iOS's launch
         cross-fade revealing the blank, unpainted web view for a few frames
         in the meantime. Text briefly uses the fallback font until Exo 2
         arrives (display=swap already did this for the font files). -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

    <title>Adaptive Performance | Training Log</title>

    <!-- Launch splash: plain HTML/CSS so it paints instantly, before the JS
         bundle loads. main.tsx fades it out ~2s after launch. Only a real
         cold start (app fully closed, then opened) re-runs this page —
         returning from the background resumes the live page, no splash.
         The splash background is pure black (#000), not the app's #121212,
         because iOS's own launch screen is black — matching it exactly is
         what removes the one-frame flash at launch. The logo is inlined (a
         small, trimmed 560px WebP pre-flattened onto black) rather than loaded from /logo.png, so it paints in the very
         same frame as the dark background — no brief empty-screen flicker
         while a separate image request finishes. -->
    <script>
      // Skip the splash when the page is reloading itself just to apply an
      // app update (see registerServiceWorker in main.tsx) — the person
      // already saw it on launch moments ago.
      // The one-time first-launch warm reload keeps the splash but without
      // re-running the fade-in, so it reads as one continuous splash.
      try {
        if (sessionStorage.getItem("atl:skip-splash")) {
          sessionStorage.removeItem("atl:skip-splash");
          document.documentElement.classList.add("no-splash");
        }
        if (sessionStorage.getItem("atl:splash-noanim")) {
          sessionStorage.removeItem("atl:splash-noanim");
          document.documentElement.classList.add("splash-noanim");
        }
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        background: #121212;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition: opacity 0.4s ease;
      }
      #splash img {
        width: min(66vw, 300px);
        height: auto;
        animation: splash-logo-in 0.35s ease-out both;
      }
      .splash-noanim #splash img {
        animation: none;
      }
      @keyframes splash-logo-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .no-splash #splash {
        display: none;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
